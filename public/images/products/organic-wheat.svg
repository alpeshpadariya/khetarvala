<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EEDC"/>
      <stop offset="100%" style="stop-color:#FFF8E7"/>
    </linearGradient>
    <linearGradient id="grain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8D6E63;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#2E7D32;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#8D6E63;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grain)"/>
  <g transform="translate(400, 400)">
    <!-- Wheat stalk -->
    <path d="M0 -200 Q 20 -150 0 -100 Q -20 -50 0 0 Q 20 50 0 100 Q -20 150 0 200" 
          stroke="#8D6E63" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M0 -200 Q 20 -150 0 -100 Q -20 -50 0 0 Q 20 50 0 100 Q -20 150 0 200" 
          stroke="#2E7D32" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Wheat grains -->
    <g fill="#FFF8E7" stroke="#8D6E63" stroke-width="1">
      <ellipse cx="-30" cy="-180" rx="8" ry="12" transform="rotate(-20)"/>
      <ellipse cx="25" cy="-160" rx="8" ry="12" transform="rotate(15)"/>
      <ellipse cx="-20" cy="-120" rx="8" ry="12" transform="rotate(-10)"/>
      <ellipse cx="30" cy="-80" rx="8" ry="12" transform="rotate(25)"/>
      <ellipse cx="-15" cy="-40" rx="8" ry="12" transform="rotate(5)"/>
      <ellipse cx="20" cy="0" rx="8" ry="12" transform="rotate(-15)"/>
      <ellipse cx="-25" cy="40" rx="8" ry="12" transform="rotate(20)"/>
      <ellipse cx="15" cy="80" rx="8" ry="12" transform="rotate(-25)"/>
      <ellipse cx="-10" cy="120" rx="8" ry="12" transform="rotate(10)"/>
      <ellipse cx="35" cy="160" rx="8" ry="12" transform="rotate(-5)"/>
    </g>
  </g>
  <text x="400" y="750" font-family="Georgia, serif" font-size="28" fill="#2E7D32" text-anchor="middle" opacity="0.6">Khetar Vala</text>
  <text x="400" y="780" font-family="Inter, sans-serif" font-size="16" fill="#8D6E63" text-anchor="middle" opacity="0.5">Organic Wheat</text>
</svg>