<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7"/>
      <stop offset="100%" style="stop-color:#F5EEDC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Field -->
  <path d="M0 400 Q 200 300 400 400 Q 600 300 800 400 L800 600 L0 600 Z" fill="#FFF0D0" opacity="0.5"/>
  <!-- Wheat rows -->
  <g fill="#2E7D32" opacity="0.12">
    <path d="M0 440 Q 100 380 200 440 Q 300 380 400 440 Q 500 380 600 440 Q 700 380 800 440 L800 600 L0 600 Z"/>
    <path d="M0 500 Q 80 450 160 500 Q 240 450 320 500 Q 400 450 480 500 Q 560 450 640 500 Q 720 450 800 500 L800 600 L0 600 Z" opacity="0.08"/>
    <path d="M0 560 Q 60 520 120 560 Q 180 520 240 560 Q 300 520 360 560 Q 420 520 480 560 Q 540 520 600 560 Q 660 520 720 560 Q 780 520 800 560 L800 600 L0 600 Z" opacity="0.06"/>
  </g>
  <!-- Foreground wheat -->
  <g stroke="#8D6E63" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35">
    <path d="M100 580 Q 120 500 100 420 Q 80 340 100 260"/>
    <path d="M250 590 Q 270 510 250 430 Q 230 350 250 270"/>
    <path d="M400 580 Q 420 500 400 420 Q 380 340 400 260"/>
    <path d="M550 590 Q 570 510 550 430 Q 530 350 550 270"/>
    <path d="M700 580 Q 720 500 700 420 Q 680 340 700 260"/>
  </g>
  <!-- Wheat grains -->
  <g fill="#FFF8E7" stroke="#8D6E63" stroke-width="1" opacity="0.45">
    <ellipse cx="90" cy="400" rx="6" ry="10" transform="rotate(-20 90 400)"/>
    <ellipse cx="240" cy="420" rx="6" ry="10" transform="rotate(15 240 420)"/>
    <ellipse cx="390" cy="400" rx="6" ry="10" transform="rotate(-10 390 400)"/>
    <ellipse cx="540" cy="420" rx="6" ry="10" transform="rotate(20 540 420)"/>
    <ellipse cx="690" cy="400" rx="6" ry="10" transform="rotate(-5 690 400)"/>
  </g>
  <!-- Traditional farming tools -->
  <g fill="#8D6E63" opacity="0.25">
    <path d="M150 500 L150 350 Q 170 330 200 330 Q 230 330 230 350 L230 500 Z"/>
    <circle cx="190" cy="500" r="20"/>
  </g>
  <text x="400" y="560" font-family="Georgia, serif" font-size="28" fill="#2E7D32" text-anchor="middle" opacity="0.5">Khetar Vala Farm</text>
</svg>